<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>가비 서비스 관리자</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <div class="brand">
        <img class="brand-mark" src="logo.png" alt="" width="32" height="32">
        <span class="brand-name">가비 서비스 관리자</span>
      </div>
      <p class="note">가비 앱 계정으로 로그인해요. 관리자로 등록된 계정만 들어올 수 있어요.</p>
      <label class="field">아이디<input name="login_id" autocomplete="username" required></label>
      <label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="small warn" role="alert"></p>
      <button type="submit" class="btn primary">로그인</button>
    </form>
  </section>

  <div id="app" hidden>
    <div class="top">
      <header>
        <div class="brand">
          <img class="brand-mark" src="logo.png" alt="" width="32" height="32">
          <span class="brand-name">가비 서비스 관리자</span>
          <span class="pill">관리자 전용</span>
        </div>
        <div class="who">
          <span id="who">관리자</span>
          <button type="button" class="btn" data-action="logout">로그아웃</button>
        </div>
      </header>
      <nav class="tabs" id="tabs" aria-label="관리자 메뉴"></nav>
    </div>

    <main id="view" aria-live="polite"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>

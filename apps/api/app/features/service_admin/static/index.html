<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>가비 서비스 관리자</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css?v=23">
</head>
<body>
  <!-- 화면 틀은 운영 관리자 웹(apps/ops-admin)과 같다: 왼쪽 남색 메뉴 + 위 고정 머리줄 + 본문 -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="login-head"><b>GABEE</b><span>SERVICE ADMIN</span></div>
      <div class="login-body">
        <h1>서비스 관리자 로그인</h1>
        <p class="login-note">가비 앱 계정으로 로그인해요. 관리자로 등록된 계정만 들어올 수 있어요.</p>
        <label class="field">아이디<input name="login_id" autocomplete="username" required></label>
        <label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="login-err" role="alert"></p>
        <button type="submit" class="btn primary">로그인</button>
      </div>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <aside class="sidebar" aria-label="서비스 관리자 메뉴">
      <div class="brand"><b>GABEE</b><span>SERVICE ADMIN</span></div>
      <nav class="nav" id="tabs"></nav>
      <div class="side-foot">
        <div class="who-box"><div class="avatar" aria-hidden="true">서</div><div><strong>서비스 관리자</strong><small id="who">관리자</small></div></div>
        <button type="button" class="theme-toggle" id="theme-toggle" data-action="theme-toggle" role="switch" aria-checked="false">
          <svg class="theme-ic sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-ic moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="theme-label">Dark mode</span>
          <span class="theme-switch" aria-hidden="true"></span>
        </button>
        <button type="button" class="logout" data-action="logout">로그아웃</button>
      </div>
    </aside>
    <div class="scrim" data-action="close-menu"></div>
    <div class="main">
      <header class="hdr">
        <div class="hdr-in">
          <button type="button" class="ibtn menu-btn" data-action="open-menu" aria-label="메뉴 숨기기" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="hdr-t"><h1 id="page-title">서비스 관리자</h1><p id="page-sub"></p></div>
        </div>
      </header>
      <main id="view" class="content" aria-live="polite"></main>
    </div>

    <!-- 관리자 챗봇: 오른쪽 아래 작은 버튼. 질문은 /admin/knowledge/ask 로 보낸다 -->
    <button type="button" class="chat-fab" data-action="chat-toggle" aria-label="챗봇 열기" aria-expanded="false" aria-controls="chat-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    </button>
    <section id="chat-panel" class="chat-panel" aria-label="관리자 챗봇" hidden>
      <header class="chat-head">
        <div><strong>GaBee 챗봇</strong><small>관리자 업무를 물어보세요</small></div>
        <div class="chat-head-btns">
          <button type="button" class="chat-clear" data-action="chat-clear">대화 비우기</button>
          <button type="button" class="chat-close" data-action="chat-toggle" aria-label="챗봇 닫기">×</button>
        </div>
      </header>
      <div id="chat-log" class="chat-log" aria-live="polite"><div id="chat-suggest" class="chat-suggest"></div></div>
      <form id="chat-form" class="chat-form">
        <input name="q" autocomplete="off" maxlength="300" placeholder="질문을 입력하세요" aria-label="질문">
        <button type="submit" class="btn primary sm">보내기</button>
      </form>
    </section>
  </div>

  <script src="app.js?v=36"></script>
</body>
</html>

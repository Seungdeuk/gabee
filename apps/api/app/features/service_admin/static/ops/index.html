<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- 서비스 관리자 화면의 '운영 › 서버 상태' 탭 안(iframe)에서 열린다. 원본: apps/ops-admin/index.html (release/1.2 1f4eac0).
       다른 점: 샘플 모드 파일(sample-account.js·local-config.js) 대신 embed.js 를 먼저 읽고, 같은 출처(API 서버)만 부른다. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>가비 운영 관리자</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="운영 관리자 메뉴">
    <div class="brand"><b>GaBee</b><span>OPERATIONS ADMIN</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who"><div class="avatar">운</div><div><strong>운영 담당자</strong><small>ops-admin</small></div></div>
      <button class="logout" data-act="logout">로그아웃</button>
    </div>
  </aside>
  <div class="scrim" data-act="closeMenu"></div>
  <div class="main">
    <header class="hdr"><div class="hdr-in" id="hdr"></div></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="loginRoot" class="login" hidden></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="js/embed.js?v=1"></script>
<script type="module" src="js/app.js?v=6"></script>
</body>
</html>

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # knowledge: 임베딩(ONNX)과 pgvector
    "numpy>=1.26",
    "tokenizers>=0.19",
    "pgvector>=0.3",
    # ai_assistant/ingest: 원본 전처리 (사진 회전·축소, HEIC, 한국어 OCR, 오피스·PDF → 마크다운)
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
    "markitdown[docx,xlsx,pptx,pdf]>=0.1",
    "pypdfium2>=4",  # 스캔본 PDF 의 쪽을 그림으로 바꿔 OCR 한다
    # 회원가입 비밀번호 해시(Argon2id)
    "argon2-cffi>=23.1",
    # 로그인 Access Token(JWT)
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 긴 줄은 포매터(ruff format)가 코드만 줄이고 주석·문자열은 그대로 두므로 E501 은 끈다
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app"]

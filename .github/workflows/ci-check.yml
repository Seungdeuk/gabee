name: CI Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  api-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gabee_ci
          POSTGRES_PASSWORD: gabee_ci
          POSTGRES_DB: gabee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabee_ci -d gabee_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gabee_ci:gabee_ci@localhost:5432/gabee_ci
      PGVECTOR_TEST_DATABASE_URL: postgresql+psycopg://gabee_ci:gabee_ci@localhost:5432/gabee_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest tests/test_pgvector.py -v
      - name: FastAPI health check against PostgreSQL
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "FastAPI health check failed" && exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

name: CI Check

# 임시 비활성화(2026-10-27): GitHub Actions 결제 문제로 자동 실행이 막혀 수동 실행 전용으로 바꿨다.
# 결제가 풀리면 아래 on: 블록을 원래대로(pull_request + push: main) 되돌린다.
# 주의: Deploy Shared DB(shared_db_deploy.py)는 '이 커밋의 main push CI Check 성공'을 요구하므로, 비활성화 중에는 공용 DB 자동 반영이 막힌다.
on:
  workflow_dispatch:
# on:
#   pull_request:
#   push:
#     branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  api-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gabee_ci
          POSTGRES_PASSWORD: gabee_ci
          POSTGRES_DB: gabee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabee_ci -d gabee_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gabee_ci:gabee_ci@localhost:5432/gabee_ci
      PGVECTOR_TEST_DATABASE_URL: postgresql+psycopg://gabee_ci:gabee_ci@localhost:5432/gabee_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Alembic head 가 정확히 1개인지 확인
        run: python scripts/check_alembic_migrations.py heads
      - name: 임시 테스트 DB 가 빈 상태인지 확인
        run: python scripts/check_alembic_migrations.py assert-empty
      - name: 처음부터 최신 head 까지 전체 마이그레이션 실행 (실패하면 바로 위 "Running upgrade A -> B" 로그가 문제 리비전)
        run: alembic upgrade head
      - name: 적용된 리비전이 코드 head 와 같은지 확인
        run: python scripts/check_alembic_migrations.py assert-at-head
      - name: 모델과 DB 스키마 일치 확인
        run: python scripts/check_schema_matches_models.py
      - run: pytest tests/test_pgvector.py -v
      - name: FastAPI health check against PostgreSQL
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "FastAPI health check failed" && exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

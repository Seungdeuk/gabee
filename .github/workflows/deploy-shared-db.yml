# 팀 공용 PostgreSQL(gabee)에 Alembic 마이그레이션을 자동 적용한다. 설계·보안 모델: docs/adr/0006-shared-db-auto-migration.md
#
# - 기본은 꺼져 있다: 저장소 변수 SHARED_DB_DEPLOY_ENABLED 와 SHARED_DB_RUNNER_ISOLATION_APPROVED 가 둘 다 'true' 가
#   아니면 Job 이 건너뛰어진다. 뒤의 변수는 "배포 러너 격리 정책(ADR 0007)이 확정·적용됐다"는 명시적 확인이며,
#   그 전에는 켜지 않는다(러너가 협업자 브랜치의 워크플로우에도 호출될 수 있어 pgpass 가 노출될 위험이 있음).
# - 처음에는 dry-run 만 한다(백업·복원 검증·리허설까지): SHARED_DB_DEPLOY_APPLY 가 'true' 가 되어야 실제 적용.
# - 트리거는 main 의 CI Check 완료(workflow_run)와 수동 재실행(workflow_dispatch, main 한정)뿐이다.
#   pull_request 계열 트리거는 절대 쓰지 않는다(PR 코드가 내부망 DB·러너에 닿지 못하게 함).
#   workflow_run 워크플로우는 항상 기본 브랜치(main)의 정의로 실행되므로 PR 이 이 파일을 바꿔 우회할 수 없다.
# - 이 라벨(gabee-db-deploy)의 self-hosted 러너는 이 파일에서만 쓴다(tests/test_workflow_safety.py 가 검사).
name: Deploy Shared DB

on:
  workflow_run:
    workflows: ["CI Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "백업·복원 검증·리허설까지만 실행(실제 DB 미적용)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: shared-db-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.SHARED_DB_DEPLOY_ENABLED == 'true' &&
      vars.SHARED_DB_RUNNER_ISOLATION_APPROVED == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: [self-hosted, windows, gabee-db-deploy]
    timeout-minutes: 45
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          clean: true

      - name: 배포 도구 설치 (러너 임시 가상환경)
        shell: powershell
        run: |
          python -m venv "$env:RUNNER_TEMP\deploy-venv"
          & "$env:RUNNER_TEMP\deploy-venv\Scripts\python.exe" -m pip install --quiet -e apps/api
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 공용 DB 마이그레이션 배포 (CI 검증 → 백업 → 복원 검증 → 리허설 → 적용 → 사후 검증)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_DIR: ${{ vars.SHARED_DB_BACKUP_DIR }}
          STATE_DIR: ${{ vars.SHARED_DB_STATE_DIR }}
          PGPASS_FILE: ${{ vars.SHARED_DB_PGPASS }}
          APPLY_ENABLED: ${{ vars.SHARED_DB_DEPLOY_APPLY }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          foreach ($name in 'BACKUP_DIR', 'STATE_DIR', 'PGPASS_FILE') {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              Write-Error "저장소 변수 $name 이(가) 설정되지 않았습니다."; exit 2
            }
          }
          $dry = @()
          if ($env:APPLY_ENABLED -ne 'true' -or $env:DISPATCH_DRY_RUN -eq 'true') { $dry = @('--dry-run') }
          $result = Join-Path $env:RUNNER_TEMP 'deploy-result.json'
          & "$env:RUNNER_TEMP\deploy-venv\Scripts\python.exe" apps/api/scripts/shared_db_deploy.py run `
            --sha $env:DEPLOY_SHA --repo $env:GITHUB_REPOSITORY `
            --backup-dir $env:BACKUP_DIR --state-dir $env:STATE_DIR --pgpass $env:PGPASS_FILE `
            --result-file $result @dry
          exit $LASTEXITCODE
